name: Static Analysis
on: [push, pull_request]
permissions:
  contents: read

jobs:
  static_analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-go@v6
      with:
        # staticcheck@latest (2026.2.x) cannot read the export data format
        # produced by Go 1.27+, so pin to the newest Go release it supports.
        go-version: '1.26'

    - name: Install analysis tools
      run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.0

    - name: Vet
      run: go vet ./...

    - name: Staticcheck
      run: staticcheck ./...
